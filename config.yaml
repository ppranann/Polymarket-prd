# Polymarket Weather Sniping Bot - Configuration 2026
# ===================================================

polymarket:
  chain_id: 137
  api_url: https://clob.polymarket.com
  api_key: ${POLYMARKET_API_KEY}
  clob_contract_address: "0x4b13c5378b5e7c8c2c2a8e7c3a4d9e2f1b5c8d3a"

tomorrow_io:
  api_key: ${TOMORROW_IO_API_KEY}
  base_url: https://api.tomorrow.io/v4
  units: metric # CRITICAL: Seoul and London stations report in Celsius
  fields: [temperature, temperatureApparent, temperatureMin, temperatureMax, precipitationProbability]
  timesteps: 1h

risk:
  initial_capital: 30.0            # Your $30 bankroll
  max_trade_size: 3.00             # 10% of capital ($3 minimum for Rewards)
  max_daily_loss: 4.50             # 15% hard circuit breaker
  max_open_positions: 3            # Quality over quantity
  position_concentration: 0.20
  profit_target: 1.0

scanner:
  scan_interval: 30
  price_threshold: 0.80           # TEST VALUE: High enough to "see" markets
  categories:
    - weather
    - temperature
    - precipitation
    - global                      # Essential for non-US markets
    - science
  filters:
    active: true
    liquidity_rewards_only: false # Set to false to verify "Discovery" works
  keywords:
    - Seoul
    - London
    - Incheon
    - Heathrow
    - Temperature
    - Rain
  weather_cache_ttl: 900
  snipe_price_threshold: 0.80     # Match scanner for testing

alpha:
  enabled: true
  threshold: 0.15                 # 15% edge is a solid signal

logging:
  level: INFO
  format: json
  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}
    table_prefix: polymarket_

development:
  dry_run: false
  paper_trading: true             # Keep simulated for the final Saturday test