# Polymarket Weather Sniping Bot - Configuration 2026
# ===================================================

polymarket:
  chain_id: 137
  api_url: https://clob.polymarket.com
  api_key: ${POLYMARKET_API_KEY}
  clob_contract_address: "0x4b13c5378b5e7c8c2c2a8e7c3a4d9e2f1b5c8d3a"

aws:
  region: ${AWS_DEFAULT_REGION:-us-east-1}
  secret_name: polymarket-bot/production

tomorrow_io:
  api_key: ${TOMORROW_IO_API_KEY}
  base_url: https://api.tomorrow.io/v4
  units: metric # CRITICAL: Seoul and London stations report in Celsius
  fields: [temperature, temperatureApparent, temperatureMin, temperatureMax, precipitationProbability]
  timesteps: 1h
  default_location:
    lat: 37.5665  # Seoul
    lon: 126.9780

risk:
  initial_capital: 30.0
  max_trade_size: 500.00           # Absolute safety ceiling (pct cap is the real limit)
  max_trade_size_pct: 0.10         # 10% of current capital per trade (scales automatically)
  kelly_scale: 0.25               # 25% Kelly → produces 4-10% of capital, scales with balance
  min_trade_size: 1.00            # Min fallback bet = $1 (3% of $30 capital)
  max_daily_loss: 4.50
  max_open_positions: 10           # Reduced from 20 — fewer, higher conviction
  position_concentration: 0.20
  profit_target: 1.0
  # Priority 4: Risk Management
  max_exposure_per_market: 10.0    # Max $10 exposure per individual market
  max_exposure_per_event: 5.0      # Max $5 across all contracts for one city+date
  max_positions_per_event: 3       # Max 3 positions per city+date event
  max_daily_trades: 50             # Fewer, higher-quality trades only
  circuit_breaker_pnl_pct: 0.20    # Trigger circuit breaker at 20% loss
  circuit_breaker_window: 60       # Within 60 minutes
  circuit_breaker_close_all: false # Don't auto-close positions on trigger

scanner:
  scan_interval: 30
  price_threshold: 0.40            # Focus on cheaper, higher-EV markets
  categories:
    - weather
    - temperature
    - precipitation
    - global                       # ADD THIS: Incheon/London are often here
    - science                      # ADD THIS: Some weather is under science
  filters:
    active: true
    liquidity_rewards_only: false  # SET TO FALSE for testing discovery
  keywords:
    - Seoul
    - London
    - Incheon
    - Heathrow
    - Temperature
    - Rain
  weather_cache_ttl: 120  # 2 minutes - keep fresh for active trading
  snipe_price_threshold: 0.30     # Focus on cheap markets with real edge

alpha:
  enabled: true
  threshold: 0.05                 # Floor for dynamic threshold (code scales with price)
  messy_middle_threshold: 0.15   # Wider no-trade zone for 0.3-0.7 fair prices
  size_multiplier_max: 2.0       # Re-enabled: scale up on strong alpha signals
  bucket_threshold: 0.10         # Stricter EV floor for bucket/max-temp markets
  min_z_score: 1.0               # Skip threshold markets where |z| < this (forecast ≈ threshold = fake edge)
  ensemble_max_spread_f: 4.0     # Skip group if NWS vs Open-Meteo disagree by more than this (°F)
  max_ladder_buckets: 2          # Ladder up to this many adjacent bucket markets per event
  min_yes_buy_price: 0.10        # Never buy YES below this unless p_model > 0.25 (cheap YES trap)

logging:
  level: INFO
  format: json
  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}
    table_prefix: polymarket_
  local:
    directory: /app/logs

# Priority 1: Cost Control
execution:
  order_timeout: 30
  retry_attempts: 3
  retry_delay: 2
  signing: {}
  cooldown_seconds: 120            # 2 minutes cooldown per market (was 900 = 15min, blocked trades)
  no_op_threshold: 0.001           # 0.1% price difference for no-op detection

# Farming configuration
farming:
  enabled: true
  price_threshold: 0.15
  max_spread: 0.05
  farming_size: 2.0
  rebalance_interval: 120          # Priority 1: Increased to 120s from 60s
  midpoint_movement_threshold: 0.01  # Priority 1: Increased to 1.0% from 0.5%
  blue_zone_buffer: 0.01

# Health monitoring
health:
  enabled: true
  check_interval: 300
  webhook: {}
  alerts:
    circuit_breaker: true
    daily_loss_limit: true

development:
  dry_run: false
  paper_trading: true             # PAPER mode: validate model before risking real money
  log_all_requests: false
  paper_capital: 5000.0           # Paper-only: large capital so Kelly always clears $1 min
  paper_max_positions: 100        # Paper-only: high cap to collect data across many markets
  paper_max_exposure_per_event: 500.0  # Paper-only: 10% of capital per city+date event
  paper_max_daily_loss: 5000.0         # Paper-only: no effective daily loss limit (full capital)