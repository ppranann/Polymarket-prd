# Polymarket Weather Sniping Bot - Configuration 2026
# ===================================================

polymarket:
  chain_id: 137
  api_url: https://clob.polymarket.com
  api_key: ${POLYMARKET_API_KEY}
  clob_contract_address: "0x4b13c5378b5e7c8c2c2a8e7c3a4d9e2f1b5c8d3a"

tomorrow_io:
  api_key: ${TOMORROW_IO_API_KEY}
  base_url: https://api.tomorrow.io/v4
  units: metric # CRITICAL: Seoul and London stations report in Celsius
  fields: [temperature, temperatureApparent, temperatureMin, temperatureMax, precipitationProbability]
  timesteps: 1h
  default_location:
    lat: 37.5665  # Seoul
    lon: 126.9780

risk:
  initial_capital: 30.0
  max_trade_size: 3.00             # Increased to $3 for Reward eligibility
  max_trade_size_pct: 0.10         # 10% of current capital per trade (scales automatically)
  max_daily_loss: 4.50
  max_open_positions: 3
  position_concentration: 0.20
  profit_target: 1.0
  # Priority 4: Risk Management
  max_exposure_per_market: 10.0    # Max $10 exposure per individual market
  max_daily_trades: 200            # Daily trade limit to prevent over-trading
  circuit_breaker_pnl_pct: 0.20    # Trigger circuit breaker at 20% loss
  circuit_breaker_window: 60       # Within 60 minutes
  circuit_breaker_close_all: false # Don't auto-close positions on trigger

scanner:
  scan_interval: 30
  price_threshold: 0.85            # RAISE THIS to 0.85 so we can see all markets
  categories:
    - weather
    - temperature
    - precipitation
    - global                       # ADD THIS: Incheon/London are often here
    - science                      # ADD THIS: Some weather is under science
  filters:
    active: true
    liquidity_rewards_only: false  # SET TO FALSE for testing discovery
  keywords:
    - Seoul
    - London
    - Incheon
    - Heathrow
    - Temperature
    - Rain
  weather_cache_ttl: 120  # 2 minutes - keep fresh for active trading
  snipe_price_threshold: 0.80     # Match scanner for testing

alpha:
  enabled: true
  threshold: 0.15                 # 15% edge is a solid signal

logging:
  level: INFO
  format: json
  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}
    table_prefix: polymarket_

# Priority 1: Cost Control
execution:
  order_timeout: 30
  retry_attempts: 3
  retry_delay: 2
  signing: {}
  cooldown_seconds: 120            # 2 minutes cooldown per market (was 900 = 15min, blocked trades)
  no_op_threshold: 0.001           # 0.1% price difference for no-op detection

# Farming configuration
farming:
  enabled: true
  price_threshold: 0.15
  max_spread: 0.05
  farming_size: 2.0
  rebalance_interval: 120          # Priority 1: Increased to 120s from 60s
  midpoint_movement_threshold: 0.01  # Priority 1: Increased to 1.0% from 0.5%
  blue_zone_buffer: 0.01

# Health monitoring
health:
  enabled: true
  check_interval: 300
  webhook: {}
  alerts:
    circuit_breaker: true
    daily_loss_limit: true

development:
  dry_run: false
  paper_trading: true             # Keep simulated for the final Saturday test