version: '3.8'

# IMPORTANT: Run ./deploy.sh to automatically pull and deploy the latest image
# This file will be updated automatically with the correct ECR image URL

services:
  weather-bot:
    # Image URL is set dynamically by deploy.sh
    image: ${ECR_IMAGE:-polymarket-weather-bot:latest}
    container_name: polymarket-weather-bot
    environment:
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_SECRET_NAME=polymarket-bot/production
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - PYTHONPATH=/app
      - PAPER_TRADING=true   # Safety: blocks real CLOB even if --paper flag is missing
    volumes:
      # Config is baked into the image — no local override needed.
      # Change config.yaml locally, commit, push, and redeploy.
      - ./logs:/app/logs
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    command: ["python", "-m", "src.main", "--config", "/app/config.yaml"]
    # To run in LIVE mode: add --live flag above. Without it, bot is always in paper mode.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

