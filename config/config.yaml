# Polymarket Weather Sniping Bot - Configuration
# ===============================================

# Polymarket Configuration
polymarket:
  chain_id: 137  # Polygon mainnet
  api_url: https://clob.polymarket.com
  api_key: ${POLYMARKET_API_KEY}
  # Contract addresses (Polymarket CLOB)
  clob_contract_address: "0x4b13c5378b5e7c8c2c2a8e7c3a4d9e2f1b5c8d3a"

# Tomorrow.io Weather API Configuration
tomorrow_io:
  api_key: ${TOMORROW_IO_API_KEY}
  base_url: https://api.tomorrow.io/v4
  # Request settings
  fields:
    - temperature
    - temperatureApparent
    - temperatureMin
    - temperatureMax
    - precipitationProbability
    - weatherCode
  timesteps: 1h
  units: metrics
  # Default location for weather data (Seoul, South Korea)
  default_location:
    lat: 37.5665
    lon: 126.9780

# AWS Secrets Manager Configuration
aws:
  region: us-east-1
  secret_name: polymarket-bot/production
  # Alternative: Use local .env file for development
  use_env_file: true
  env_file_path: .env

# Risk Parameters
risk:
  initial_capital: 30.0            # Starting capital in USD ($30 deposited)
  max_trade_size: 1.50             # Maximum per-event position (5% of capital)
  max_daily_loss: 2.00             # Stop trading if exceeded (~$7 max loss)
  max_open_positions: 3            # Diversification limit (smaller for $30)
  position_concentration: 0.20     # Max 20% concentration
  profit_target: 1.0               # 100% profit = auto-exit

# Farming Parameters (Liquidity Rewards)
farming:
  enabled: true
  price_threshold: 0.10           # Farm when YES price < $0.10
  max_spread: 0.02                # Spread between buy/sell orders
  farming_size: 1.50              # Size per liquidity order (adjusted for $30)
  # 2026 Adjusted Midpoint Farming
  rebalance_interval: 60          # Rebalance orders every 60 seconds max
  midpoint_movement_threshold: 0.005  # Rebalance if midpoint moves > 0.5%
  blue_zone_buffer: 0.01          # Stay within 1% of midpoint for rewards

# Scanner Parameters
scanner:
  scan_interval: 30               # Seconds between price scans
  price_threshold: 0.85           # Scan YES price < $0.85
  categories: []
  # Keywords for filtering weather markets (Wide Net approach)
  keywords:
    - "Seoul"
    - "NYC"
    - "London"
    - "Heathrow"
    - "Temperature"
    - "Snow"
    - "Rain"
    - "°C"
    - "Korea"
  # Market filters
  filters:
    active: true
    liquidity_rewards_only: false  # Set to false for testing discovery
  # Lazy API Settings (save Tomorrow.io credits)
  weather_cache_ttl: 900          # Cache weather for 15 minutes (900 seconds)
  snipe_price_threshold: 0.80     # Only fetch weather for markets < $0.80
  min_weather_update_interval: 15 # Minimum minutes between weather API calls

# Alpha Snipe Parameters
alpha:
  enabled: true
  threshold: 0.20                 # 20% undervaluation = alpha signal
  size_multiplier_max: 3.0        # Max 3x position size increase

# Logging and Monitoring
logging:
  level: INFO                     # DEBUG, INFO, WARNING, ERROR
  format: json
  # Supabase configuration
  supabase:
    url: ${SUPABASE_URL}
    key: ${SUPABASE_KEY}
    table_prefix: polymarket_
  # Local logging
  local:
    enabled: true
    log_dir: logs
    max_file_size_mb: 10
    backup_count: 5

# Health Check and Alerts
health:
  enabled: true
  check_interval: 60              # Seconds
  # Webhook alerts (e.g., Discord, Slack)
  webhook:
    url: ${WEBHOOK_URL}
    enabled: false
  # Critical alerts
  alerts:
    on_trade: true
    on_error: true
    on_profit: true
    on_loss: true

# Execution Settings
execution:
  order_timeout: 30               # Seconds to wait for order fill
  retry_attempts: 3
  retry_delay: 1                  # Seconds
  # EIP-712 signing
  signing:
    method: eip712
    domain_name: Polymarket CLOB
    domain_version: 1.0

# Development Settings
development:
  dry_run: false                  # If true, don't actually trade
  paper_trading: true             # Simulate with fake orders
  log_all_requests: false         # Debug: log every API call

